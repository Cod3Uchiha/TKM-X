name: Rebuild VAJIRA Baileys 7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration bundle
        uses: actions/checkout@v4

      - name: Build complete bot source
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/patch.b64.* | base64 -d | gzip -d > /tmp/baileys7.patch
          git clone --depth 1 https://github.com/izumiser/KING-VAJIRA-MD.git /tmp/vajira-build
          cd /tmp/vajira-build
          git apply --check /tmp/baileys7.patch
          git apply /tmp/baileys7.patch
          rm -rf .git
          node scripts/check-project.js

      - name: Replace repository with the complete bot
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/vajira-build/. .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add complete Baileys 7 Termux bot"
          git push
